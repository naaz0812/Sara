<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formValida</title>
</head>
<body>

    <h1>Form</h1>

    <form id="validForm">
    <div class="from">
        <label for="name" >Name: </label>
        <input type="text" id="name" placeholder="Enter your name" >
        <p id="nameErr" class="error" ></p>
    </div>
    
    <div class="from">
        <label for="email" >Email: </label>
        <input type="email" id="email" placeholder="name@example.com" >
         <p id="emailErr" class="error" ></p>
    </div>

    <div class="from">
        <label for="password" >Password: </label>
        <input type="password" id="password" placeholder="Enter Password" >
         <p id="passErr" class="error" ></p>
    </div>

    <div class="from">
        <label for="confirm" >Confirm Password: </label>
        <input type="password" id="confirm" placeholder="Please Confirm Password" >
         <p id="confirmErr" class="error" ></p>
    </div>

    <div class="from">
        <label for="phone" >Phone Number: </label>
        <input type="phone" id="phone" placeholder="Enter Phone Number" required>
        <p id="phoneErr" class="error" ></p>
        </div>

        <p><button onclick="noName()" type="submit">Submit</button></p>

    </form>

</body>
<script src="Form.js"></script>
</html>
