<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changing_hello</title>
</head>
<body>
    <p id="myId">Hello</p>
    <button onclick="change()" >Click me</button>
    <script>
        function change(){
            document.getElementsById("myId").innerHTML= "Welcome";
            
        }
    </script>
</body>
</html>
